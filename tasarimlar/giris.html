<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Örnek Salon - Giriş Yap</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Playfair Display & DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#F8F3EE',
              primary: '#B98B73',
              'primary-hover': '#A77860',
              text: '#2B211C',
              taupe: '#7A6B63',
              border: '#E5DDD3',
              input: '#FFFFFF',
              surface: '#FFFFFF',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"DM Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F8F3EE;
      color: #2B211C;
      font-family: 'DM Sans', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 300,
      'GRAD' 0,
      'opsz' 24;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-[#B98B73]/20 selection:text-[#2B211C]">
  <div class="w-full max-w-md mx-auto flex-1 flex flex-col justify-between pb-8">
    
    <!-- Top & Form Content -->
    <div class="flex-1 flex flex-col">
      <!-- 1. Hero Image Header with Logo Overlay -->
      <div class="relative w-full h-[220px] rounded-b-[2.5rem] overflow-hidden shadow-sm">
        <img 
          src="https://lh3.googleusercontent.com/aida/AEtjO1WrqAwOC18-bg23U3UHbVUlf8iV3IHAzC9tKgL5Iiuwjaci0-cR23eL9EE9CXnziJWnEOd0hEhAditGtJ7nR69cWtRuIkZbCMcnkoY_Do2p85J3EmZo0169BGTPl4CovFE5EVLrGK-T2Qv79cjXo0ElMCqKbzJ35qfvTrH1A0gVknCLxaXMEi4t-M9UZI3GrMc55WlN03IvTN7xjkke8_zDBrkXwSIxYuAqRNlnoW4qwU63N-C54c-JIy7I" 
          alt="Örnek Salon Salon" 
          class="w-full h-full object-cover object-center"
        />
        <!-- Overlay Gradient: soft warm dark top, fading to cream background at the bottom -->
        <div class="absolute inset-0 bg-gradient-to-b from-[#2B211C]/65 via-[#2B211C]/35 to-[#F8F3EE]"></div>

        <!-- Centered Logo inside Hero -->
        <div class="absolute inset-0 flex flex-col items-center justify-center pt-2">
          <span class="text-white text-2xl tracking-[0.25em] font-serif font-medium uppercase drop-shadow-sm">
            ÖRNEK
          </span>
          <span class="text-[#F8F3EE]/90 text-xs tracking-[0.35em] font-serif italic uppercase mt-1">
            SALON
          </span>
        </div>
      </div>

      <!-- Main Login Section -->
      <div class="px-6 pt-6 flex-1 flex flex-col">
        <!-- 2. Heading & Subtitle -->
        <div class="text-center mb-6">
          <h1 class="font-serif text-3xl text-brand-text font-normal tracking-tight">
            Tekrar hoş geldin
          </h1>
          <p class="text-brand-taupe text-sm mt-1.5 font-normal">
            Randevularını ve puanlarını görmek için giriş yap.
          </p>
        </div>

        <!-- Form Elements -->
        <form class="space-y-4" onsubmit="event.preventDefault();">
          <!-- 3. E-posta Input -->
          <div>
            <label class="block text-xs font-medium text-brand-text mb-1.5 ml-1">
              E-posta
            </label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3.5 text-brand-taupe text-xl pointer-events-none">
                mail
              </span>
              <input 
                type="email" 
                placeholder="ornek@mail.com" 
                required
                class="w-full bg-brand-input border border-brand-border rounded-xl pl-11 pr-4 py-3.5 text-sm text-brand-text placeholder-brand-taupe/60 focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary transition-all duration-200 shadow-sm"
              />
            </div>
          </div>

          <!-- 4. Şifre Input -->
          <div>
            <label class="block text-xs font-medium text-brand-text mb-1.5 ml-1">
              Şifre
            </label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3.5 text-brand-taupe text-xl pointer-events-none">
                lock
              </span>
              <input 
                type="password" 
                id="passwordInput"
                placeholder="••••••••" 
                required
                class="w-full bg-brand-input border border-brand-border rounded-xl pl-11 pr-11 py-3.5 text-sm text-brand-text placeholder-brand-taupe/60 focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary transition-all duration-200 shadow-sm"
              />
              <button 
                type="button" 
                onclick="const p = document.getElementById('passwordInput'); const isPass = p.type === 'password'; p.type = isPass ? 'text' : 'password'; this.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';"
                class="absolute right-3.5 text-brand-taupe hover:text-brand-text transition-colors p-0.5 focus:outline-none"
                aria-label="Şifreyi Göster"
              >
                <span class="material-symbols-outlined text-xl">
                  visibility
                </span>
              </button>
            </div>
          </div>

          <!-- 5. Şifremi unuttum Link -->
          <div class="flex justify-end pt-0.5">
            <a href="#" class="text-xs text-brand-primary hover:text-brand-primary-hover font-medium transition-colors">
              Şifremi unuttum
            </a>
          </div>

          <!-- 6. Giriş Yap Button -->
          <div class="pt-2">
            <button 
              type="submit" 
              class="w-full bg-brand-primary hover:bg-brand-primary-hover active:scale-[0.99] text-white font-medium py-3.5 px-6 rounded-full shadow-md shadow-brand-primary/20 transition-all duration-150 flex items-center justify-center text-base"
            >
              Giriş Yap
            </button>
          </div>
        </form>

        <!-- 7. Kayıt Ol Prompt -->
        <div class="text-center mt-6">
          <p class="text-xs text-brand-taupe">
            Hesabın yok mu? 
            <a href="#" class="text-brand-primary hover:text-brand-primary-hover font-bold ml-1 transition-colors">
              Kayıt Ol
            </a>
          </p>
        </div>
      </div>
    </div>

    <!-- 8. Guest Browsing Link at the very bottom -->
    <div class="pt-8 text-center px-6">
      <a href="#" class="text-xs text-brand-taupe hover:text-brand-text transition-colors underline decoration-brand-border underline-offset-4 font-normal">
        Giriş yapmadan göz at
      </a>
    </div>

  </div>
<script>window.ADIM = 12;</script><script src="akis.js"></script>
</body>
</html>
